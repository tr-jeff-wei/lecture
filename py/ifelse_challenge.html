<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python 流程圖出題練習</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; }
        .mermaid svg { max-width: 100%; height: auto; }
        .editor-shell { min-height: 20rem; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-900 px-5 py-4">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3">
            <div>
                <p class="text-xs font-semibold uppercase tracking-[0.25em] text-amber-400">Python Practice</p>
                <h1 class="mt-1 text-2xl font-bold">把流程圖寫成程式碼</h1>
            </div>
            <div id="match-status" class="rounded-full border border-amber-400/40 bg-amber-400/10 px-4 py-2 text-sm text-amber-200">
                尚未完成
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-7xl space-y-5 p-5">
        <section class="border-l-4 border-amber-400 bg-slate-900 px-5 py-4 shadow-lg shadow-black/20">
            <h2 class="text-lg font-semibold text-amber-300">題目</h2>
            <p class="mt-2 text-slate-300">請依照左側流程圖，完成右側 Python 程式碼。程式需要先讀入成績，成績達到 60 分時輸出「及格」，否則輸出「不及格」。</p>
        </section>

        <section class="grid gap-5 lg:grid-cols-2">
            <article class="overflow-hidden border border-slate-800 bg-slate-900">
                <div class="flex items-center justify-between border-b border-slate-800 px-4 py-3">
                    <div>
                        <h2 class="font-semibold">題目流程圖</h2>
                        <p class="text-xs text-slate-400">請讓右側流程圖與這張圖完全相同</p>
                    </div>
                    <span class="text-2xl text-amber-400">01</span>
                </div>
                <div class="flex min-h-[26rem] items-center justify-center overflow-auto bg-slate-950 p-6">
                    <div id="target-flowchart" class="mermaid w-full text-center"></div>
                </div>
            </article>

            <article class="overflow-hidden border border-slate-800 bg-slate-900">
                <div class="border-b border-slate-800 px-4 py-3">
                    <h2 class="font-semibold">你的流程圖</h2>
                    <p class="text-xs text-slate-400">輸入程式碼後，這裡會同步更新並即時比對</p>
                </div>
                <div class="flex min-h-[26rem] items-center justify-center overflow-auto bg-slate-950 p-6">
                    <div id="user-flowchart" class="mermaid w-full text-center"></div>
                </div>
            </article>
        </section>

        <section class="overflow-hidden border border-slate-800 bg-slate-900">
            <div class="border-b border-slate-800 px-4 py-3">
                <h2 class="font-semibold">輸入 Python 程式碼</h2>
                <p class="text-xs text-slate-400">輸入時，右上方的流程圖會同步更新</p>
            </div>
            <div id="editor-container" class="editor-shell h-72 w-full"></div>
            <p id="error-msg" class="hidden border-t border-slate-800 px-4 py-3 text-sm text-rose-400">目前的程式碼還無法產生完整流程圖。</p>
        </section>
    </main>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });

        const answerCode = `score = int(input())
if score >= 60:
    print('及格')
else:
    print('不及格')`;

        let editor;

        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: `score = int(input())
if score >= 60:
    print('')
else:
    print('')`,
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false },
                padding: { top: 14, bottom: 14 },
                scrollBeyondLastLine: false
            });

            editor.onDidChangeModelContent(() => updateUserFlowchart(editor.getValue()));
            updateUserFlowchart(editor.getValue());
        });

        function escapeLabel(text) {
            return text.replace(/([()[\]{}])/g, '\\$1');
        }

        function flowchartFromPython(code) {
            const lines = code.split('\n').filter(line => line.trim());
            const graph = ['flowchart TD'];
            const nodes = [];
            const stack = [];
            let nodeNumber = 0;
            let previous = null;
            let branch = null;

            const start = addNode('start', '開始');
            previous = start;

            function addNode(shape, label) {
                const id = `node${nodeNumber++}`;
                nodes.push({ id, shape, label });
                return id;
            }

            function connect(from, to, label) {
                graph.push(`    ${from} -->${label ? `|${label}|` : ''} ${to}`);
            }

            for (const line of lines) {
                const indent = line.search(/\S/);
                const text = line.trim();

                while (stack.length && indent <= stack[stack.length - 1].indent && !text.startsWith('else:')) {
                    stack.pop();
                }

                if (text.match(/^[A-Za-z_]\w*\s*=\s*int\(input\(\)\)/)) {
                    const name = text.match(/^([A-Za-z_]\w*)/)[1];
                    const input = addNode('input', `輸入 ${name}`);
                    if (previous) connect(previous, input);
                    previous = input;
                    continue;
                }

                if (text.startsWith('if ')) {
                    const conditionText = text.slice(3).replace(/:$/, '').trim();
                    const condition = addNode('condition', `${conditionText}?`);
                    if (previous) connect(previous, condition);
                    stack.push({ indent, condition, parent: previous });
                    previous = condition;
                    branch = 'yes';
                    continue;
                }

                if (text === 'else:') {
                    const current = stack[stack.length - 1];
                    if (!current) return null;
                    previous = current.condition;
                    branch = 'no';
                    continue;
                }

                if (text.startsWith('print(')) {
                    const match = text.match(/^print\(['"](.*?)['"]\)$/);
                    if (!match || !stack.length) return null;
                    const output = addNode('output', `輸出：${match[1]}`);
                    connect(previous, output, branch === 'no' ? '否' : '是');
                    stack[stack.length - 1][branch === 'no' ? 'noOutput' : 'yesOutput'] = output;
                    previous = output;
                }
            }

            const current = stack[0];
            if (!current || !current.yesOutput || !current.noOutput) return null;
            const end = addNode('end', '結束');
            connect(current.yesOutput, end);
            connect(current.noOutput, end);

            for (const node of nodes) {
                const shape = node.shape === 'condition' ? `{${escapeLabel(node.label)}}`
                    : node.shape === 'input' ? `[/"${escapeLabel(node.label)}"/]`
                    : node.shape === 'output' ? `["${escapeLabel(node.label)}"]`
                    : `([${escapeLabel(node.label)}])`;
                graph.splice(1, 0, `    ${node.id}${shape}`);
            }

            return graph.join('\n');
        }

        const targetGraph = flowchartFromPython(answerCode);
        renderGraph('target-flowchart', targetGraph, 'target');

        function updateUserFlowchart(code) {
            const graph = flowchartFromPython(code);
            const errorMsg = document.getElementById('error-msg');
            const status = document.getElementById('match-status');

            if (!graph) {
                errorMsg.classList.remove('hidden');
                status.textContent = '請完成流程';
                status.className = 'rounded-full border border-rose-400/40 bg-rose-400/10 px-4 py-2 text-sm text-rose-200';
                renderGraph('user-flowchart', 'flowchart TD\n    error[請輸入完整的 if / else 程式碼]', 'user');
                return;
            }

            errorMsg.classList.add('hidden');
            renderGraph('user-flowchart', graph, 'user');
            const isMatch = normalizeGraph(graph) === normalizeGraph(flowchartFromPython(answerCode));
            status.textContent = isMatch ? '流程圖完全相同' : '流程圖還不相同';
            status.className = isMatch
                ? 'rounded-full border border-emerald-400/40 bg-emerald-400/10 px-4 py-2 text-sm text-emerald-200'
                : 'rounded-full border border-amber-400/40 bg-amber-400/10 px-4 py-2 text-sm text-amber-200';
        }

        function normalizeGraph(graph) {
            return graph.replace(/node\d+/g, 'node').replace(/\s+/g, ' ').trim();
        }

        async function renderGraph(elementId, graph, renderId) {
            const element = document.getElementById(elementId);
            try {
                const result = await mermaid.render(`flowchart-${renderId}-${Date.now()}`, graph);
                element.innerHTML = result.svg;
            } catch (error) {
                element.textContent = '流程圖暫時無法顯示';
            }
        }
    </script>
</body>
</html>
